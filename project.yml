name: WhatsAppHD
options:
  bundleIdPrefix: com.studio
  deploymentTarget:
    iOS: "16.0"
targets:
  WhatsAppHD:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studio.whatsapphd
      TARGETED_DEVICE_FAMILY: "1"
