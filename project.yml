name: WhatsAppHD
options:
  bundleIdPrefix: com.studio
  deploymentTarget:
    iOS: "16.0"
targets:
  WhatsAppHD:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Aplikasi butuh akses galeri untuk membaca video 4K."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studio.whatsapphd
      TARGETED_DEVICE_FAMILY: "1"
