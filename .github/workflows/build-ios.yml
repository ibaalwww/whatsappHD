name: Auto Build WhatsAppHD Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Info.plist
        run: |
          mkdir -p Sources
          cat <<EOF > Sources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Aplikasi butuh akses galeri untuk membaca video 4K.</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project WhatsAppHD.xcodeproj \
            -scheme WhatsAppHD \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package App into .IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "WhatsAppHD.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r WhatsAppHD-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppHD-Unsigned-IPA
          path: WhatsAppHD-Unsigned.ipa
