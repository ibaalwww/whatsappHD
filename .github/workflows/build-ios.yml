name: Auto Build iBaalStatus Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode 16
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          echo "Using Xcode from: $LATEST_XCODE"
          sudo xcode-select -switch "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          mkdir -p Sources
          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project iBaalStatus.xcodeproj \
            -scheme iBaalStatus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package App into .IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "iBaalStatus.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r iBaalStatus-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iBaalStatus-Unsigned-IPA
          path: iBaalStatus-Unsigned.ipa
